      // State Management
      let appState = {
        profile: null,
        pin: null,
        isUnlocked: false,
        departments: {},
        currentView: 'dashboard', // 'dashboard', 'apply', 'records', 'overtime', 'ledger'
        leaveRecords: [],
        overtimeLogs: [],
        drafts: [], // Array of draft forms
        activeDraftId: null,
        enteredPin: '',
        activeModal: null, // 'rules', 'drafts', 'editProfile', 'changePin', 'printPreview', 'attendanceCalendar', 'musterPrintPreview'
        selectedPrintRecord: null,
        recordsFilterQuery: '',
        recordsFilterFrom: '',
        recordsFilterTo: '',
        // Daily Attendance State
        attendanceLogs: [],
        calMonth: new Date().getMonth(),
        calYear: new Date().getFullYear(),
        selectedCalendarDate: null,
        prefillOvertime: null,
        // Institutional Holidays & Regularization State

        showDailyRoster: true,

      // Form submission guard flag to prevent submitted forms from re-saving to drafts
      let isFormSubmitting = false;
      let autoSaveTimer = null;

      // Cross-compatible ID aliases helper
      const _origGetElementById = document.getElementById.bind(document);
      document.getElementById = function(id) {
        const el = _origGetElementById(id);
        if (el) return el;
        const aliases = {
          'coffSelectorDropdown': 'lf-coff-select',
          'lf-coff-select': 'coffSelectorDropdown',
          'cOffDetailsInput': 'lf-coff-details',
          'lf-coff-details': 'cOffDetailsInput',
          'workDescription': 'ot-desc',
          'ot-desc': 'workDescription'
        };
        if (aliases[id]) return _origGetElementById(aliases[id]);
        return null;
      };

      // ==========================================
      // LOCAL STORAGE HELPERS
      // ==========================================
      function loadStorage() {
        try {
          const profile = localStorage.getItem('mmantc_user_profile');
          const pin = localStorage.getItem('mmantc_pin');
          const depts = localStorage.getItem('mmantc_departments');
          const records = localStorage.getItem('mmantc_leave_records');
          const overtime = localStorage.getItem('mmantc_overtime_records') || localStorage.getItem('mmantc_overtime_logs');
          const drafts = localStorage.getItem('mmantc_leave_drafts');
          const legacyDraft = localStorage.getItem('mmantc_leave_draft');
          const attendance = localStorage.getItem('mmantc_attendance_logs');
          const holidays = localStorage.getItem('mmantc_holidays');

          appState.profile = profile ? JSON.parse(profile) : null;
          appState.pin = pin || null;
          appState.departments = depts ? JSON.parse(depts) : { ...DEFAULT_DEPARTMENTS };
          appState.leaveRecords = records ? JSON.parse(records) : [];
          appState.attendanceLogs = attendance ? JSON.parse(attendance) : [];
          appState.holidays = holidays ? JSON.parse(holidays) : [...DEFAULT_HOLIDAYS];
          
          const rawOt = overtime ? JSON.parse(overtime) : [];
          appState.overtimeLogs = rawOt.map(item => ({
            ...item,
            dutyType: item.dutyType || item.type || 'Duty',
            type: item.type || item.dutyType || 'Duty',
            description: item.description !== undefined ? item.description : (item.workDescription || item.desc || '')
          }));

          // Ensure both localStorage keys exist and are in sync
          localStorage.setItem('mmantc_overtime_logs', JSON.stringify(appState.overtimeLogs));
          localStorage.setItem('mmantc_overtime_records', JSON.stringify(appState.overtimeLogs));
          localStorage.setItem('mmantc_holidays', JSON.stringify(appState.holidays));

          // Migrate or load drafts
          if (drafts) {
            appState.drafts = JSON.parse(drafts);
          } else if (legacyDraft) {
            const single = JSON.parse(legacyDraft);
            appState.drafts = [single];
            localStorage.removeItem('mmantc_leave_draft');
            localStorage.setItem('mmantc_leave_drafts', JSON.stringify(appState.drafts));
          } else {
            appState.drafts = [];
          }

          if (sessionStorage.getItem('mmantc_session_unlocked') === 'true' && appState.pin) {
            appState.isUnlocked = true;
          }
        } catch (e) {
          console.error("Storage loading error:", e);
        }
      }

      function saveStorage() {
        try {
          if (appState.profile) localStorage.setItem('mmantc_user_profile', JSON.stringify(appState.profile));
          if (appState.pin) localStorage.setItem('mmantc_pin', appState.pin);
          localStorage.setItem('mmantc_departments', JSON.stringify(appState.departments));
          localStorage.setItem('mmantc_leave_records', JSON.stringify(appState.leaveRecords));
          localStorage.setItem('mmantc_overtime_logs', JSON.stringify(appState.overtimeLogs));
          localStorage.setItem('mmantc_overtime_records', JSON.stringify(appState.overtimeLogs));
          localStorage.setItem('mmantc_leave_drafts', JSON.stringify(appState.drafts));
          localStorage.setItem('mmantc_attendance_logs', JSON.stringify(appState.attendanceLogs));
          localStorage.setItem('mmantc_holidays', JSON.stringify(appState.holidays));
          localStorage.removeItem('mmantc_leave_draft'); // Clean legacy
        } catch (e) {
          console.error("Storage saving error:", e);
        }
      }

      function showToast(message, type = 'info') {
        const toast = document.getElementById('toast');
        const content = document.getElementById('toast-content');
        if (!toast || !content) return;

        const icons = {
          success: `<svg class="w-4 h-4 text-emerald-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"/></svg>`,
          error: `<svg class="w-4 h-4 text-rose-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/></svg>`,
          info: `<svg class="w-4 h-4 text-blue-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>`
        };

        content.innerHTML = `${icons[type] || icons.info}<span>${message}</span>`;
        toast.classList.remove('translate-y-20', 'opacity-0', 'pointer-events-none');
        toast.classList.add('translate-y-0', 'opacity-100');

        setTimeout(() => {
          toast.classList.remove('translate-y-0', 'opacity-100');
          toast.classList.add('translate-y-20', 'opacity-0', 'pointer-events-none');
        }, 2600);
      }

      // ==========================================
      // DATE & WORKFLOW HELPERS
      // ==========================================
      function formatDateDisplay(dateStr) {
        if (!dateStr) return '';
        try {
          const parts = dateStr.split('-');
          if (parts.length === 3) return `${parts[2]}/${parts[1]}/${parts[0]}`;
          return dateStr;
        } catch {
          return dateStr;
        }
      }

      function getTodayString() {
        return new Date().toISOString().split('T')[0];
      }

      // Compute dates array in range with optional Sunday exclusion
      function getDatesInRange(startDateStr, endDateStr, excludeSundays = true) {
        if (!startDateStr || !endDateStr) return [];
        const start = new Date(startDateStr + 'T00:00:00');
        const end = new Date(endDateStr + 'T00:00:00');
        if (isNaN(start.getTime()) || isNaN(end.getTime()) || start > end) return [];

        const dates = [];
        let cur = new Date(start);
        while (cur <= end) {
          const isSunday = cur.getDay() === 0;
          if (!excludeSundays || !isSunday) {
            const yyyy = cur.getFullYear();
            const mm = String(cur.getMonth() + 1).padStart(2, '0');
            const dd = String(cur.getDate()).padStart(2, '0');
            dates.push(`${dd}/${mm}/${yyyy}`);
          }
          cur.setDate(cur.getDate() + 1);
        }
        return dates;
      }

      function calculateDaysDiff(fromDateStr, toDateStr, isHalfDay = false, excludeSundays = true) {
        if (!fromDateStr || !toDateStr) return 1;
        const validDates = getDatesInRange(fromDateStr, toDateStr, excludeSundays);
        if (validDates.length === 0) return 0;
        return isHalfDay ? Math.max(0.5, validDates.length - 0.5) : validDates.length;
      }

      // ==========================================
      // ATTENDANCE & PUNCH TRACKING HELPERS
      // ==========================================
      function formatTime12h(dateObj) {
        if (!dateObj) return '--:--';
        const d = (typeof dateObj === 'string' || typeof dateObj === 'number') ? new Date(dateObj) : dateObj;
        let hours = d.getHours();
        const minutes = d.getMinutes();
        const ampm = hours >= 12 ? 'PM' : 'AM';
        hours = hours % 12;
        hours = hours ? hours : 12;
        const minStr = minutes < 10 ? '0' + minutes : minutes;
        const hrStr = hours < 10 ? '0' + hours : hours;
        return `${hrStr}:${minStr} ${ampm}`;
      }

      function convert12hTo24h(time12) {
        if (!time12 || time12 === '--:--' || time12 === '--') return '';
        const match = time12.match(/(\d+):(\d+)\s*(AM|PM)/i);
        if (!match) return '';
        let [_, h, m, ampm] = match;
        let hh = parseInt(h, 10);
        if (ampm.toUpperCase() === 'PM' && hh < 12) hh += 12;
        if (ampm.toUpperCase() === 'AM' && hh === 12) hh = 0;
        return `${String(hh).padStart(2, '0')}:${m}`;
      }

      function getAttendanceForDate(dateStr) {
        return appState.attendanceLogs.find(l => l.date === dateStr);
      }

      function getLeaveForDate(dateStr) {
        return appState.leaveRecords.find(r => {
          if (!r.fromDate || !r.toDate) return false;
          return dateStr >= r.fromDate && dateStr <= r.toDate;
        });
      }

      function getHolidayForDate(dateStr) {
        if (!dateStr || !appState.holidays) return null;
        const exact = appState.holidays.find(h => h.date === dateStr);
        if (exact) return exact;
        // Check recurring MM-DD
        const parts = dateStr.split('-');
        if (parts.length === 3) {
          const mmdd = `${parts[1]}-${parts[2]}`;
          const recurring = appState.holidays.find(h => {
            const hParts = h.date?.split('-');
            return hParts && hParts.length === 3 && `${hParts[1]}-${hParts[2]}` === mmdd;
          });
          if (recurring) return recurring;
        }
        return null;
      }

      window.openRegularizeForm = function(dateStr) {
        appState.isRegularizingDate = dateStr;
        render();
      };

      window.cancelRegularizeForm = function() {
        appState.isRegularizingDate = null;
        render();
      };

      window.saveAttendanceRegularization = function(dateStr) {
        const inVal = document.getElementById('reg-in')?.value;
        const outVal = document.getElementById('reg-out')?.value;
        const statusVal = document.getElementById('reg-status')?.value || 'Present';
        const remarksVal = document.getElementById('reg-remarks')?.value.trim() || '';

        if (!inVal) {
          showToast('Please specify Punch In time', 'error');
          return;
        }

        const formatTimeStr = (val) => {
          if (!val) return null;
          const [hh, mm] = val.split(':').map(Number);
          const ampm = hh >= 12 ? 'PM' : 'AM';
          const h12 = hh % 12 || 12;
          const hrPadded = h12 < 10 ? '0' + h12 : h12;
          return `${hrPadded}:${String(mm).padStart(2, '0')} ${ampm}`;
        };

        const inTime12 = formatTimeStr(inVal);
        const outTime12 = formatTimeStr(outVal);

        let hoursNum = 0;
        let totalHoursStr = '--';
        if (inVal && outVal) {
          const [hIn, mIn] = inVal.split(':').map(Number);
          const [hOut, mOut] = outVal.split(':').map(Number);
          const totalMinutes = (hOut * 60 + mOut) - (hIn * 60 + mIn);
          if (totalMinutes > 0) {
            hoursNum = Math.round((totalMinutes / 60) * 10) / 10;
            totalHoursStr = `${hoursNum.toFixed(1)} hrs`;
          }
        }

        const isLate = isLateMarkLog({ inTime: inTime12, date: dateStr });
        const lateMins = isLate ? getLateMinutes(inTime12) : 0;

        let log = appState.attendanceLogs.find(l => l.date === dateStr);
        if (!log) {
          log = {
            id: 'ATT-' + Date.now(),
            date: dateStr,
            inTime: inTime12,
            inTimestamp: new Date(`${dateStr}T${inVal}:00`).getTime(),
            outTime: outTime12,
            outTimestamp: outVal ? new Date(`${dateStr}T${outVal}:00`).getTime() : null,
            totalHours: totalHoursStr,
            totalHoursNum: hoursNum,
            status: statusVal,
            remarks: remarksVal,
            isLateMark: isLate,
            lateMinutes: lateMins,
            locationTag: '📍 Mansoora Campus (Regularized)',
            isCampusVerified: true,
            isRegularized: true
          };
          appState.attendanceLogs.push(log);
        } else {
          log.inTime = inTime12;
          log.outTime = outTime12;
          log.totalHours = totalHoursStr;
          log.totalHoursNum = hoursNum;
          log.status = statusVal;
          log.remarks = remarksVal;
          log.isLateMark = isLate;
          log.lateMinutes = lateMins;
          log.isRegularized = true;
        }

        // Automatic Overtime & C-Off Credit for Sunday, Vacation, or Holiday duty
        const dObj = new Date(dateStr + 'T00:00:00');
        const isSunday = !isNaN(dObj.getTime()) && dObj.getDay() === 0;
        const hol = getHolidayForDate(dateStr);

        let otCreditMsg = '';
        if (hoursNum > 0 && (isSunday || hol)) {
          const dutyType = isSunday ? 'Week Off' : 'Vacation';
          const holName = isSunday ? 'Sunday' : (hol ? hol.name : 'Vacation');
          const earnedCoff = calculateEarnedCoff(dutyType, hoursNum);
          const workDesc = remarksVal || `Manual duty logged for ${holName} (${hoursNum} hrs, Punch: ${inTime12} to ${outTime12 || 'EOD'})`;

          let existingOt = appState.overtimeLogs.find(l => l.date === dateStr);
          if (existingOt) {
            existingOt.hours = hoursNum;
            existingOt.earnedCoff = earnedCoff;
            existingOt.type = dutyType;
            existingOt.dutyType = dutyType;
            existingOt.holidayName = holName;
            if (remarksVal) existingOt.description = workDesc;
          } else {
            const newOt = {
              id: Date.now(),
              date: dateStr,
              type: dutyType,
              dutyType: dutyType,
              holidayName: holName,
              hours: hoursNum,
              description: workDesc,
              earnedCoff: earnedCoff,
              status: 'Available',
              createdAt: new Date().toISOString()
            };
            appState.overtimeLogs.push(newOt);
          }
          otCreditMsg = ` & +${earnedCoff} C-Off credited to Overtime Log (${holName})!`;
        } else if (hoursNum > 8 && !isSunday && !hol) {
          const otHours = Math.round((hoursNum - 8) * 10) / 10;
          const earnedCoff = calculateEarnedCoff('Overtime', otHours);
          const workDesc = remarksVal || `Shift Overtime on ${dateStr} (${otHours} extra hrs, Punch: ${inTime12} to ${outTime12})`;

          let existingOt = appState.overtimeLogs.find(l => l.date === dateStr && l.type === 'Overtime');
          if (existingOt) {
            existingOt.hours = otHours;
            existingOt.earnedCoff = earnedCoff;
            if (remarksVal) existingOt.description = workDesc;
          } else {
            const newOt = {
              id: Date.now(),
              date: dateStr,
              type: 'Overtime',
              dutyType: 'Overtime',
              holidayName: 'Shift Overtime',
              hours: otHours,
              description: workDesc,
              earnedCoff: earnedCoff,
              status: 'Available',
              createdAt: new Date().toISOString()
            };
            appState.overtimeLogs.push(newOt);
          }
          otCreditMsg = ` & +${earnedCoff} C-Off credited for overtime (${otHours} hrs)!`;
        }

        saveStorage();

      // Helper: 90-Day Academic Validity Tracker for Earned C-Off Duties
      function getCoffValidity(dateStr) {
        if (!dateStr) return { daysLeft: 90, status: 'valid', text: '90d valid', badgeClass: 'bg-emerald-50 text-emerald-700 border-emerald-200' };
        const earnedDate = new Date(dateStr + 'T00:00:00');
        const now = new Date();
        const diffMs = now.getTime() - earnedDate.getTime();
        const diffDays = Math.floor(diffMs / (1000 * 60 * 60 * 24));
        const daysLeft = 90 - diffDays;
        if (daysLeft < 0) {
          return { daysLeft: 0, status: 'expired', text: 'Expired (>90d)', badgeClass: 'bg-rose-50 text-rose-700 border-rose-200' };
        } else if (daysLeft <= 25) {
          return { daysLeft, status: 'expiring', text: `${daysLeft}d left (Expiring)`, badgeClass: 'bg-amber-50 text-amber-800 border-amber-300' };
        } else {
          return { daysLeft, status: 'valid', text: `${daysLeft}d valid`, badgeClass: 'bg-emerald-50 text-emerald-700 border-emerald-200' };
        }
      }

      window.handleBiometricFileUpload = function(e) {
        const file = e.target.files?.[0];
        if (!file) return;

        if (!window.XLSX) {
          alert('Excel parser library is still loading, please retry in a moment.');
          return;
        }

        const reader = new FileReader();
        reader.onload = function(evt) {
          try {
            const data = new Uint8Array(evt.target.result);
            const workbook = XLSX.read(data, { type: 'array' });
            const firstSheet = workbook.Sheets[workbook.SheetNames[0]];
            const rows = XLSX.utils.sheet_to_json(firstSheet, { defval: '' });

            if (!rows || rows.length === 0) {
              showToast('Uploaded biometric sheet contains no data rows.', 'error');
              return;
            }

            let importedCount = 0;
            let sundayOtCount = 0;

            rows.forEach((row, idx) => {
              // Find Date column
              const dateKey = Object.keys(row).find(k => /date/i.test(k));
              if (!dateKey || !row[dateKey]) return;

              let rawDate = String(row[dateKey]).trim();
              let dateStr = '';
              if (/^\d{5}$/.test(rawDate)) {
                const jsDate = new Date(Math.round((Number(rawDate) - 25569) * 86400 * 1000));
                dateStr = jsDate.toISOString().split('T')[0];
              } else if (/^\d{4}-\d{2}-\d{2}$/.test(rawDate)) {
                dateStr = rawDate;
              } else if (/^\d{1,2}[\/\-]\d{1,2}[\/\-]\d{4}$/.test(rawDate)) {
                const parts = rawDate.split(/[\/\-]/);
                dateStr = `${parts[2]}-${String(parts[1]).padStart(2, '0')}-${String(parts[0]).padStart(2, '0')}`;
              }

              if (!dateStr || !/^\d{4}-\d{2}-\d{2}$/.test(dateStr)) return;

              // Find In & Out times
              const inKey = Object.keys(row).find(k => /in/i.test(k) && !/out/i.test(k));
              const outKey = Object.keys(row).find(k => /out/i.test(k));
              const rawIn = inKey ? String(row[inKey]).trim() : '';
              const rawOut = outKey ? String(row[outKey]).trim() : '';

              if (!rawIn && !rawOut) return;

              const formatPunch = (t) => {
                if (!t) return '--';
                if (/AM|PM/i.test(t)) return t;
                if (/^\d{1,2}:\d{2}/.test(t)) {
                  const [hh, mm] = t.split(':').map(Number);
                  const ampm = hh >= 12 ? 'PM' : 'AM';
                  const h12 = hh % 12 || 12;
                  return `${h12 < 10 ? '0' + h12 : h12}:${String(mm).padStart(2, '0')} ${ampm}`;
                }
                return t;
              };

              const inTime = formatPunch(rawIn);
              const outTime = rawOut ? formatPunch(rawOut) : '--';

              let hoursNum = 0;
              let totalHoursStr = '--';
              if (rawIn && rawOut && /^\d{1,2}:\d{2}/.test(rawIn) && /^\d{1,2}:\d{2}/.test(rawOut)) {
                const [h1, m1] = rawIn.split(':').map(Number);
                const [h2, m2] = rawOut.split(':').map(Number);
                const mins = (h2 * 60 + m2) - (h1 * 60 + m1);
                if (mins > 0) {
                  hoursNum = Math.round((mins / 60) * 10) / 10;
                  totalHoursStr = `${hoursNum.toFixed(1)} hrs`;
                }
              }

              let existing = appState.attendanceLogs.find(l => l.date === dateStr);
              if (existing) {
                existing.inTime = inTime;
                existing.outTime = outTime;
                existing.totalHours = totalHoursStr;
                existing.totalHoursNum = hoursNum;
                existing.status = hoursNum < 4.5 && hoursNum > 0 ? 'Half Day' : 'Present';
              } else {
                appState.attendanceLogs.push({
                  id: 'ATT-' + Date.now() + '-' + idx,
                  date: dateStr,
                  inTime,
                  outTime,
                  totalHours: totalHoursStr,
                  totalHoursNum: hoursNum,
                  status: hoursNum < 4.5 && hoursNum > 0 ? 'Half Day' : 'Present',
                  remarks: 'Biometric Machine Import'
                });
              }
              importedCount++;

              // Automatic Sunday / Vacation / Holiday Overtime logging
              const dObj = new Date(dateStr + 'T00:00:00');
              const isSun = !isNaN(dObj.getTime()) && dObj.getDay() === 0;
              const hol = getHolidayForDate(dateStr);
              if (hoursNum > 0 && (isSun || hol)) {
                const dutyType = isSun ? 'Week Off' : 'Vacation';
                const holName = isSun ? 'Sunday' : (hol ? hol.name : 'Vacation');
                const earned = calculateEarnedCoff(dutyType, hoursNum);
                let existingOt = appState.overtimeLogs.find(l => l.date === dateStr);
                if (existingOt) {
                  existingOt.hours = hoursNum;
                  existingOt.earnedCoff = earned;
                } else {
                  appState.overtimeLogs.push({
                    id: Date.now() + idx,
                    date: dateStr,
                    type: dutyType,
                    dutyType: dutyType,
                    holidayName: holName,
                    hours: hoursNum,
                    description: `Biometric duty on ${holName} (${hoursNum} hrs)`,
                    earnedCoff: earned,
                    status: 'Available',
                    createdAt: new Date().toISOString()
                  });
                }
                sundayOtCount++;
              }
            });

            saveStorage();
            showToast(`Biometric Sync: ${importedCount} records loaded (${sundayOtCount} Sunday/Holiday C-Off credited)!`, 'success');
            render();
          } catch (err) {
            alert('Error parsing biometric sheet: ' + err.message);
          }
        };
        reader.readAsArrayBuffer(file);
      };

      // Helper: Robust Late Mark Detection (>09:20 AM on Mon-Sat, excluding holidays)
      function isLateMarkLog(log) {
        if (!log) return false;
        if (log.isLateMark === true) return true;
        if (!log.inTime || log.inTime === '--') return false;

        // Skip Sunday
        if (log.date) {
          const dObj = new Date(log.date + 'T00:00:00');
          if (!isNaN(dObj.getTime()) && dObj.getDay() === 0) return false;
          if (getHolidayForDate(log.date)) return false;
        }

        // Parse 12h or 24h inTime string
        const t = String(log.inTime).trim();
        const match = t.match(/(\d{1,2}):(\d{2})(?:\s*([AP]M))?/i);
        if (!match) return false;

        let hh = parseInt(match[1], 10);
        const mm = parseInt(match[2], 10);
        const ampm = match[3] ? match[3].toUpperCase() : null;

        if (ampm === 'PM' && hh < 12) hh += 12;
        if (ampm === 'AM' && hh === 12) hh = 0;

        const totalMins = hh * 60 + mm;
        const cutoffMins = 9 * 60 + 20; // 09:20 AM
        return totalMins > cutoffMins;
      }

      function getLateMinutes(inTime) {
        if (!inTime) return 0;
        const match = String(inTime).trim().match(/(\d{1,2}):(\d{2})(?:\s*([AP]M))?/i);
        if (!match) return 0;
        let hh = parseInt(match[1], 10);
        const mm = parseInt(match[2], 10);
        const ampm = match[3] ? match[3].toUpperCase() : null;
        if (ampm === 'PM' && hh < 12) hh += 12;
        if (ampm === 'AM' && hh === 12) hh = 0;
        const totalMins = hh * 60 + mm;
        return Math.max(0, totalMins - (9 * 60 + 20));
      }

      // Geofencing Coordinates: MMANTC Mansoora Campus, Malegaon (Lat: 20.531957, Lng: 74.520149, Radius: 500m)
      const MMANTC_CAMPUS_GEO = {
        lat: 20.531957,
        lng: 74.520149,
        radiusMeters: 500
      };

      function calculateCampusDistance(lat, lon) {
        const R = 6371e3; // metres
        const φ1 = lat * Math.PI / 180;
        const φ2 = MMANTC_CAMPUS_GEO.lat * Math.PI / 180;
        const Δφ = (MMANTC_CAMPUS_GEO.lat - lat) * Math.PI / 180;
        const Δλ = (MMANTC_CAMPUS_GEO.lng - lon) * Math.PI / 180;
        const a = Math.sin(Δφ/2) * Math.sin(Δφ/2) +
                  Math.cos(φ1) * Math.cos(φ2) *
                  Math.sin(Δλ/2) * Math.sin(Δλ/2);
        const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
        return Math.round(R * c);
      }

            };
            appState.overtimeLogs.push(newOt);

          let existingOt = appState.overtimeLogs.find(l => l.date === todayStr && l.type === 'Overtime');

            existingOt.earnedCoff = earnedCoff;

              date: todayStr,

            };
            appState.overtimeLogs.push(newOt);
          }
          otMsg = ` | +${earnedCoff} C-Off credited (${otHours} hrs)`;
        }

        saveStorage();

      window.exportAttendanceToExcel = function() {
        if (!window.XLSX) {
          alert('Excel export engine is loading, please retry in a moment.');
          return;
        }

        const monthNames = ["January", "February", "March", "April", "May", "June", "July", "August", "September", "October", "November", "December"];
        const dayNames = ["Sunday", "Monday", "Tuesday", "Wednesday", "Thursday", "Friday", "Saturday"];
        const year = appState.calYear || new Date().getFullYear();
        const month = appState.calMonth !== undefined ? appState.calMonth : new Date().getMonth();
        const monthName = monthNames[month];
        const daysInMonth = new Date(year, month + 1, 0).getDate();

        const exportData = [];
        for (let day = 1; day <= daysInMonth; day++) {
          const dStr = `${year}-${String(month + 1).padStart(2, '0')}-${String(day).padStart(2, '0')}`;
          const dObj = new Date(year, month, day);
          const dayName = dayNames[dObj.getDay()];
          const att = getAttendanceForDate(dStr);
          const leave = getLeaveForDate(dStr);

          let status = 'Not Logged';
          const hol = getHolidayForDate(dStr);
          if (dObj.getDay() === 0) status = 'Sunday / Week Off';
          if (hol) status = `Holiday (${hol.name})`;
          if (leave) {
            status = `On Leave (${leave.natureOfLeave || 'Leave'})`;
          }
          if (att && att.inTime) {
            status = att.outTime ? (att.totalHoursNum < 4.5 ? 'Half Day Present' : 'Present') : 'Punched In (Active)';
          }

          exportData.push({
            "Date": dStr,
            "Day": dayName,
            "Punch In": att?.inTime || '--',
            "Punch Out": att?.outTime || '--',
            "Total Hours": att?.totalHours || '--',
            "Status": status,
            "Remarks / Details": att?.remarks || (leave ? `${leave.natureOfLeave} [Form #${leave.formNumber || 'N/A'}] - ${leave.reason || ''}` : (hol ? hol.name : ''))
          });
        }

        const ws = XLSX.utils.json_to_sheet(exportData);
        const wb = XLSX.utils.book_new();
        XLSX.utils.book_append_sheet(wb, ws, `${monthName}_${year}`);
        XLSX.writeFile(wb, `MMANTC_Attendance_${monthName}_${year}.xlsx`);
        showToast(`Attendance for ${monthName} ${year} exported to Excel!`, 'success');
      };

      // ==========================================
      // C-OFF CALCULATION RULES
      // ==========================================
      // Week Off / Vacation: 6+ hrs = 1.0; 3 to 5.9 hrs = 0.5; < 3 hrs = 0
      // Regular Day Overtime: 6+ hrs = 1.0; 3 to 5.9 hrs = 0.5; < 3 hrs = 0
      function calculateEarnedCoff(dutyType, hours) {
        const h = parseFloat(hours) || 0;
        if (h >= 6.0) return 1.0;
        if (h >= 3.0) return 0.5;
        return 0;
      }

      // ==========================================
      // BALANCES & LEDGER CALCULATION
      // ==========================================
      function calculateBalances() {
        if (!appState.profile) return { cl: 12, ml: 15, coff: 0, availed: 0 };

        const totalCL = parseFloat(appState.profile.yearlyCL) || 12;
        const totalML = parseFloat(appState.profile.yearlyML) || 15;

        let totalCoffEarned = 0;
        let redeemedCoff = 0;
        appState.overtimeLogs.forEach(log => {
          const earned = parseFloat(log.earnedCoff) || 0;
          totalCoffEarned += earned;
          if (log.status === 'Redeemed') {
            redeemedCoff += earned;
          }
        });
        const availableCoff = Math.max(0, totalCoffEarned - redeemedCoff);

        let clAvailed = 0;
        let mlAvailed = 0;
        let elAvailed = 0;
        let odAvailed = 0;

        appState.leaveRecords.forEach(rec => {
          const days = parseFloat(rec.numberOfDays) || 1;
          if (rec.natureOfLeave === 'CL') clAvailed += days;
          else if (rec.natureOfLeave === 'ML') mlAvailed += days;
          else if (rec.natureOfLeave === 'EL') elAvailed += days;
          else if (rec.natureOfLeave === 'OD') odAvailed += days;
        });

        // Feature 1: Late Mark Penalty (3 Late Marks = 0.5 CL auto-deducted)
        const curYearStr = new Date().getFullYear().toString();
        const curMonthStr = getTodayString().substring(0, 7);
        const lateLogsInYear = appState.attendanceLogs.filter(l => l.date && l.date.startsWith(curYearStr) && isLateMarkLog(l));
        const lateLogsInMonth = appState.attendanceLogs.filter(l => l.date && l.date.startsWith(curMonthStr) && isLateMarkLog(l));
        const lateMarksYear = lateLogsInYear.length;
        const lateMarksMonth = lateLogsInMonth.length;
        const latePenaltyDays = Math.floor(lateMarksYear / 3) * 0.5;
        const remainingToNextPenalty = 3 - (lateMarksYear % 3);

        // Auto-account penalty into CL availed
        const totalClAvailed = clAvailed + latePenaltyDays;

        return {
          totalCL,
          clAvailed: totalClAvailed,
          rawClAvailed: clAvailed,
          balanceCL: Math.max(0, totalCL - totalClAvailed),
          totalML,
          mlAvailed,
          balanceML: Math.max(0, totalML - mlAvailed),
          totalCoffEarned,
          redeemedCoff,
          availableCoff,
          elAvailed,
          odAvailed,
          totalAvailed: totalClAvailed + mlAvailed + redeemedCoff + elAvailed + odAvailed,
          // Late mark stats
          lateMarksYear,
          lateMarksMonth,
          latePenaltyDays,
          nextLatePenaltyRemaining: remainingToNextPenalty
        };
      }

                const cleaned = newDept.trim();
                if (!appState.departments[cleaned]) {

            `;
          };

          desigSelect.onchange = (e) => {

              const newDesig = prompt('Enter New Designation:');
              const curDept = deptSelect.value;
              if (newDesig && newDesig.trim() && appState.departments[curDept]) {
                const cleaned = newDesig.trim();
                if (!appState.departments[curDept].includes(cleaned)) {
                  appState.departments[curDept].push(cleaned);
                  saveStorage();
                }
                const list = appState.departments[curDept];
                desigSelect.innerHTML = `
                  ${list.map(ds => `<option value="${ds}" ${ds === cleaned ? 'selected' : ''}>${ds}</option>`).join('')}
                  <option value="__NEW_DESIG__">+ Add New Designation...</option>
                `;
              } else {
                desigSelect.value = (appState.departments[curDept] || [])[0] || '';
              }
            }
          };
        }

        if (form) {
          form.onsubmit = (e) => {
            e.preventDefault();
            const pin1 = document.getElementById('ob-pin').value;
            const pin2 = document.getElementById('ob-pin-confirm').value;

        const coffAvail = b.availableCoff;

                      <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 17h2a2 2 0 002-2v-4a2 2 0 00-2-2H5a2 2 0 00-2 2v4a2 2 0 002 2h2m2 4h6a2 2 0 002-2v-4a2 2 0 00-2-2H9a2 2 0 00-2 2v4a2 2 0 002 2zm8-12V5a2 2 0 00-2-2H9a2 2 0 00-2 2v4h10z"/></svg>

      // Dynamic Arrangement Table state
      let activeArrangements = [];

      function syncArrangementsWithDates() {
        const from = document.getElementById('lf-from')?.value;
        const to = document.getElementById('lf-to')?.value;
        const excludeSundays = document.getElementById('lf-excludesundays')?.checked ?? true;

        const dateList = getDatesInRange(from, to, excludeSundays);

        // If existing arrangements exist, preserve user inputs where possible
        const newArrangements = [];
        dateList.forEach((dStr, idx) => {
          const existing = activeArrangements[idx];
          newArrangements.push({
            date: dStr,
            subjectClass: existing?.subjectClass || '',
            time: existing?.time || '',
            staffName: existing?.staffName || ''
          });
        });

        // If no dates generated, fallback to 1 blank row
        if (newArrangements.length === 0) {
          newArrangements.push({ date: formatDateDisplay(from) || '', subjectClass: '', time: '', staffName: '' });
        }

        activeArrangements = newArrangements;
        renderArrangementRowsUI();
      }

      function renderArrangementRowsUI() {
        const container = document.getElementById('arrangement-rows-container');
        if (!container) return;

        container.innerHTML = activeArrangements.map((row, index) => `
          <div class="p-3 bg-slate-50 rounded-xl border border-slate-200 grid grid-cols-1 sm:grid-cols-12 gap-2 text-xs items-center">
            <div class="sm:col-span-1 font-bold text-slate-500 text-center">#${index + 1}</div>
            <div class="sm:col-span-3">
              <input type="text" placeholder="Date" value="${row.date || ''}" oninput="activeArrangements[${index}].date = this.value" class="w-full rounded-lg border border-slate-300 px-2.5 py-1.5 bg-white font-medium" />
            </div>
            <div class="sm:col-span-3">
              <input type="text" placeholder="Subject with Class" value="${row.subjectClass || ''}" oninput="activeArrangements[${index}].subjectClass = this.value" class="w-full rounded-lg border border-slate-300 px-2.5 py-1.5 bg-white" />
            </div>
            <div class="sm:col-span-2">
              <input type="text" placeholder="e.g. 10:00 AM - 11:00 AM" value="${row.time || ''}" oninput="activeArrangements[${index}].time = this.value" class="w-full rounded-lg border border-slate-300 px-2.5 py-1.5 bg-white" />
            </div>
            <div class="sm:col-span-2">
              <input type="text" placeholder="Alternate Faculty" value="${row.staffName || ''}" oninput="activeArrangements[${index}].staffName = this.value" class="w-full rounded-lg border border-slate-300 px-2.5 py-1.5 bg-white font-semibold" />
            </div>
            <div class="sm:col-span-1 text-center">
              ${activeArrangements.length > 1 ? `
                <button type="button" onclick="removeArrangementSlot(${index})" class="text-slate-400 hover:text-rose-600 transition p-1" title="Remove row">
                  <svg class="w-4 h-4 inline" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"/></svg>
                </button>
              ` : ''}
            </div>
          </div>
        `).join('');

      window.addManualArrangementRow = function() {
        const lastDate = activeArrangements[activeArrangements.length - 1]?.date || '';
        activeArrangements.push({ date: lastDate, subjectClass: '', time: '', staffName: '' });
        renderArrangementRowsUI();
      };

      window.removeArrangementSlot = function(index) {
        if (activeArrangements.length > 1) {
          activeArrangements.splice(index, 1);
          renderArrangementRowsUI();
        }
      };

      window.handleLeaveNatureChange = function(type) {
        const coffBox = document.getElementById('coff-picker-box');
        const coffRow = document.getElementById('coff-details-row');
        if (type === 'C-OFF') {
          coffBox?.classList.remove('hidden');
          coffRow?.classList.remove('hidden');
          populateCoffSelector();
        } else {
          coffBox?.classList.add('hidden');
          coffRow?.classList.add('hidden');
        }
      };

      window.populateCoffSelector = function(selectedId = '') {
        const dropdown = document.getElementById('coffSelectorDropdown') || document.getElementById('lf-coff-select');
        if (!dropdown) return;

        const rawRecords = localStorage.getItem('mmantc_overtime_records') || localStorage.getItem('mmantc_overtime_logs') || '[]';
        let records = [];
        try {
          records = JSON.parse(rawRecords);
        } catch (e) {
          records = appState.overtimeLogs || [];
        }

        const unredeemed = records.filter(r => r.status === 'Available' || !r.status || r.status === 'Unredeemed');

        let html = '<option value="">-- Choose from Available C-Off Duties --</option>';
        unredeemed.forEach(record => {
          const dutyType = record.dutyType || record.type || 'Duty';
          const earned = record.earnedCoff !== undefined ? record.earnedCoff : (calculateEarnedCoff ? calculateEarnedCoff(dutyType, record.hours) : 1);
          const desc = record.description || '';
          const descSnippet = desc.length > 30 ? desc.substring(0, 30) + '...' : desc;
          const isSelected = (selectedId && String(record.id) === String(selectedId)) ? 'selected' : '';
          html += `<option value="${record.id}" ${isSelected}>${record.date} | ${dutyType} (${earned} C-Off) - ${descSnippet}</option>`;
        });

        dropdown.innerHTML = html;
      };

      window.handleCoffSelected = function(selectedId) {
        const detailsInput = document.getElementById('cOffDetailsInput') || document.getElementById('lf-coff-details');
        if (!selectedId) {
          if (detailsInput) detailsInput.value = '';
          return;
        }
        const records = JSON.parse(localStorage.getItem('mmantc_overtime_records') || localStorage.getItem('mmantc_overtime_logs') || '[]');
        const matched = records.find(r => String(r.id) === String(selectedId)) || appState.overtimeLogs.find(r => String(r.id) === String(selectedId));

        if (matched) {
          const text = matched.description || '';
          if (detailsInput) detailsInput.value = text;
          const altInput = document.getElementById('lf-coff-details');
          if (altInput && altInput !== detailsInput) altInput.value = text;
        }
      };

      window.handleLeaveDatesOrTogglesChanged = function() {
        const from = document.getElementById('lf-from')?.value;
        const to = document.getElementById('lf-to')?.value;
        const isHalf = document.getElementById('lf-halfday')?.checked ?? false;
        const excludeSundays = document.getElementById('lf-excludesundays')?.checked ?? true;

        const days = calculateDaysDiff(from, to, isHalf, excludeSundays);
        const daysInput = document.getElementById('lf-days');
        const daysBadge = document.getElementById('lf-days-badge');

        if (daysInput) daysInput.value = days;
        if (daysBadge) daysBadge.innerText = `${days} Days`;

        // Suggest probable joining date
        if (to) {
          const toD = new Date(to + 'T00:00:00');
          toD.setDate(toD.getDate() + 1);
          // If joining date happens to be Sunday and excluding Sundays, skip to Monday
          if (excludeSundays && toD.getDay() === 0) {
            toD.setDate(toD.getDate() + 1);
          }
          const yyyy = toD.getFullYear();
          const mm = String(toD.getMonth() + 1).padStart(2, '0');
          const dd = String(toD.getDate()).padStart(2, '0');
          const joinInput = document.getElementById('lf-joining');
          if (joinInput) joinInput.value = `${yyyy}-${mm}-${dd}`;
        }

        syncArrangementsWithDates();
      };

        };

      window.autoSaveDraft = function() {
        if (isFormSubmitting) return;
        if (appState.currentView !== 'apply') return;
        const form = document.getElementById('leave-form');
        if (!form) return;

        const data = collectLeaveFormObject();
        // Only save if user has entered reason or dates
        if (!data.reason && !data.fromDate) return;

        const draftId = appState.activeDraftId || data.id;
        data.id = draftId;

        const existingIdx = appState.drafts.findIndex(d => d.id === draftId);
        if (existingIdx >= 0) {
          appState.drafts[existingIdx] = data;
        } else {
          appState.drafts.push(data);
          appState.activeDraftId = draftId;
        }
        saveStorage();
      };

      window.handleLeaveBack = function() {
        if (isFormSubmitting) return;
        autoSaveDraft();
        appState.activeDraftId = null;
        navigateTo('dashboard');

          if (rec && rec.coffLogId) {

      window.handleOtDateChange = function(dateStr) {
        if (!dateStr) return;
        const d = new Date(dateStr + 'T00:00:00');
        const typeSelect = document.getElementById('ot-type');
        const holidayInput = document.getElementById('ot-holidayname');

        // Check if Sunday
        if (d.getDay() === 0) {
          if (typeSelect) typeSelect.value = 'Week Off';
          if (holidayInput && !holidayInput.value) holidayInput.value = 'Sunday Duty';
        }
        previewEarnedCoffCalc();
      };

      window.previewEarnedCoffCalc = function() {
        const type = document.getElementById('ot-type')?.value || 'Week Off';
        const hours = document.getElementById('ot-hours')?.value || '6';
        const earned = calculateEarnedCoff(type, hours);
        const badge = document.getElementById('ot-calc-badge');
        if (badge) {
          badge.innerText = `+${earned} C-Off`;
          badge.className = `whitespace-nowrap font-extrabold text-xs px-3 py-1 rounded-full border ${
            earned > 0 ? 'text-emerald-800 bg-emerald-100 border-emerald-300' : 'text-slate-600 bg-slate-200 border-slate-300'
          }`;
        }
      };

      // Guaranteed reliable ID-based deletion for Overtime & C-Off ledger
      window.deleteOvertimeRecord = function(recordId) {
        if (confirm('Delete this overtime duty record?')) {
          const initialLen = appState.overtimeLogs.length;
          appState.overtimeLogs = appState.overtimeLogs.filter(l => String(l.id) !== String(recordId));

          if (appState.overtimeLogs.length < initialLen) {
            saveStorage();
            showToast('Overtime record deleted', 'success');
            render(); // Instantly updates C-Off ledger and Card 4 balance without page reload
          } else {
            showToast('Record not found', 'error');
          }
        }
      };
      window.deleteOvertimeLog = window.deleteOvertimeRecord;

      function renderInstitutionalMusterA4Template(month, year) {
        const monthNames = ["January", "February", "March", "April", "May", "June", "July", "August", "September", "October", "November", "December"];
        const dayNames = ["Sunday", "Monday", "Tuesday", "Wednesday", "Thursday", "Friday", "Saturday"];
        const m = month !== undefined ? month : new Date().getMonth();
        const y = year || new Date().getFullYear();
        const monthName = monthNames[m];
        const daysInMonth = new Date(y, m + 1, 0).getDate();
        const profile = appState.profile || {};

        let daysPresent = 0;
        let totalHours = 0;
        let clCount = 0;
        let mlCount = 0;
        let elCount = 0;
        let odCount = 0;
        let coffCount = 0;
        let sundaysCount = 0;
        let holidaysCount = 0;

        const rows = [];
        for (let d = 1; d <= daysInMonth; d++) {
          const dStr = `${y}-${String(m + 1).padStart(2, '0')}-${String(d).padStart(2, '0')}`;
          const dObj = new Date(y, m, d);
          const dayName = dayNames[dObj.getDay()];
          const isSun = dObj.getDay() === 0;
          const att = getAttendanceForDate(dStr);
          const leave = getLeaveForDate(dStr);
          const hol = getHolidayForDate(dStr);

          if (isSun) sundaysCount++;
          if (hol && !isSun) holidaysCount++;

          let status = '--';
          let inTime = '--';
          let outTime = '--';
          let hours = '--';
          let remarks = att?.remarks || '';

          if (att && att.inTime) {
            inTime = att.inTime;
            outTime = att.outTime || '--';
            hours = att.totalHours || '--';
            daysPresent += (att.totalHoursNum && att.totalHoursNum < 4.5) ? 0.5 : 1;
            totalHours += (att.totalHoursNum || 0);
            status = att.outTime ? (att.totalHoursNum < 4.5 ? 'Half Day' : 'Present') : 'Punched In';
            if (att.isRegularized) remarks = remarks ? `${remarks} (Regularized)` : 'Regularized';
          } else if (leave) {
            status = `Leave (${leave.natureOfLeave})`;
            remarks = leave.reason || '';
            const nDays = parseFloat(leave.numberOfDays) || 1;
            if (leave.natureOfLeave === 'CL') clCount += nDays;
            else if (leave.natureOfLeave === 'ML') mlCount += nDays;
            else if (leave.natureOfLeave === 'EL') elCount += nDays;
            else if (leave.natureOfLeave === 'OD') odCount += nDays;
            else if (leave.natureOfLeave === 'C-OFF') coffCount += nDays;
          } else if (hol) {
            status = `Holiday`;
            remarks = hol.name;
          } else if (isSun) {
            status = `Week Off`;
            remarks = 'Sunday';
          }

          rows.push({
            dayNum: d,
            dayName: dayName.substring(0, 3),
            dateStr: dStr,
            inTime,
            outTime,
            hours,
            status,
            remarks,
            isSun,
            isHol: !!hol,
            isLeave: !!leave,
            isPresent: !!(att && att.inTime)
          });
        }

        return `

      window.backupDataJson = function() {
        const backupObj = {
          version: '2.0',
          appName: 'MMANTC Staff Leave & C-Off Portal',
          exportTimestamp: new Date().toISOString(),
          profile: appState.profile,
          departments: appState.departments,
          leaveRecords: appState.leaveRecords,
          overtimeLogs: appState.overtimeLogs,
          drafts: appState.drafts,
          attendanceLogs: appState.attendanceLogs,
          holidays: appState.holidays
        };

        const jsonStr = JSON.stringify(backupObj, null, 2);
        const blob = new Blob([jsonStr], { type: 'application/json' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `MMANTC_Portal_Backup_${getTodayString()}.json`;
        a.click();
        URL.revokeObjectURL(url);
        showToast('Complete database exported to JSON!', 'success');

      window.handleRestoreFile = function(e) {
        const file = e.target.files?.[0];
        if (!file) return;

        const reader = new FileReader();
        reader.onload = function(evt) {
          try {
            const data = JSON.parse(evt.target.result);
            if (!data.profile && !data.leaveRecords && !data.overtimeLogs && !data.attendanceLogs) {
              alert('Invalid backup file structure.');
              return;
            }

            if (confirm('Import this backup? It will merge/restore your profile, leave applications, overtime logs, attendance, and institutional holidays.')) {
              if (data.profile) appState.profile = data.profile;
              if (data.departments) appState.departments = data.departments;
              if (Array.isArray(data.leaveRecords)) appState.leaveRecords = data.leaveRecords;
              if (Array.isArray(data.overtimeLogs)) appState.overtimeLogs = data.overtimeLogs;
              if (Array.isArray(data.drafts)) appState.drafts = data.drafts;
              if (Array.isArray(data.attendanceLogs)) appState.attendanceLogs = data.attendanceLogs;
              if (Array.isArray(data.holidays)) appState.holidays = data.holidays;

              saveStorage();
              showToast('Backup restored successfully!', 'success');
              render();
            }
          } catch (err) {
            alert('Error parsing JSON backup file: ' + err.message);
          }
        };
        reader.readAsText(file);
      };

      // Guaranteed Leave Application Submit without lingering drafts
      window.submitLeaveApplication = function(e) {
        if (e) e.preventDefault();
        
        // 1. Immediately set isFormSubmitting = true
        isFormSubmitting = true;

        // 2. Clear any active auto-save intervals or input listeners
        if (autoSaveTimer) {
          clearInterval(autoSaveTimer);
          autoSaveTimer = null;
        }

        const data = collectLeaveFormObject();

        if (!data.fromDate || !data.toDate) {
          alert('Please select both From Date and To Date.');
          isFormSubmitting = false;
          return;
        }

        // Check for duplicate / overlapping leave application for the same dates
        const overlappingRecord = appState.leaveRecords.find(r => {
          if (r.id === data.id) return false;
          if (!r.fromDate || !r.toDate) return false;
          return (data.fromDate <= r.toDate && data.toDate >= r.fromDate);
        });

        if (overlappingRecord) {
          alert(`Error: A leave application already exists for the selected date range!\n\nExisting Application:\n• Form No: ${overlappingRecord.formNumber || 'N/A'}\n• Leave Type: ${overlappingRecord.natureOfLeave}\n• Period: ${formatDateDisplay(overlappingRecord.fromDate)} to ${formatDateDisplay(overlappingRecord.toDate)}\n• Reason: ${overlappingRecord.reason || 'N/A'}\n\nMultiple leave applications cannot be submitted for the same date.`);
          showToast('Cannot submit: Leave application already exists for this date!', 'error');
          isFormSubmitting = false;
          return;
        }

        // Balance check
        const b = calculateBalances();
        const daysApplied = parseFloat(data.numberOfDays) || 1;

        if (data.natureOfLeave === 'CL' && daysApplied > b.balanceCL) {
          if (!confirm(`Warning: You have ${b.balanceCL} CL remaining, but are applying for ${daysApplied} days. Proceed anyway?`)) {
            isFormSubmitting = false;
            return;
          }
        } else if (data.natureOfLeave === 'ML' && daysApplied > b.balanceML) {
          if (!confirm(`Warning: You have ${b.balanceML} ML remaining, but are applying for ${daysApplied} days. Proceed anyway?`)) {
            isFormSubmitting = false;
            return;
          }
        } else if (data.natureOfLeave === 'C-OFF') {
          if (b.availableCoff < daysApplied) {
            if (!confirm(`Warning: You have only ${b.availableCoff} C-Off available. Proceed anyway?`)) {
              isFormSubmitting = false;
              return;
            }
          }
        }

        // Deduct / redeem C-Off if selected
        if (data.natureOfLeave === 'C-OFF' && data.coffLogId) {
          const log = appState.overtimeLogs.find(l => String(l.id) === String(data.coffLogId));
          if (log) {
            log.status = 'Redeemed';
            log.redeemedInLeaveId = data.formNumber;
          }
        }

        const newRecord = {
          id: 'REC-' + Date.now(),
          ...data,
          createdAt: new Date().toISOString()
        };

        // 3. Save completed application into localStorage records
        appState.leaveRecords.push(newRecord);

        // 4. Remove the draft explicitly
        localStorage.removeItem('mmantc_leave_draft');
        if (appState.activeDraftId) {
          appState.drafts = appState.drafts.filter(d => d.id !== appState.activeDraftId);
          appState.activeDraftId = null;
        }
        appState.drafts = appState.drafts.filter(d => d.id !== data.id && d.formNumber !== data.formNumber);

        saveStorage();

        // 5. Clear the form fields completely
        const leaveForm = document.getElementById('leave-form');
        if (leaveForm) {
          leaveForm.reset();
        }
        activeArrangements = [];

        // Transition view back to dashboard so closing preview returns cleanly
        appState.currentView = 'dashboard';
        appState.selectedPrintRecord = newRecord;

        showToast('Leave application submitted successfully!', 'success');

        // Transition to print preview
        openModal('printPreview');

        // 6. Reset isFormSubmitting = false only after submission and transition to print preview are finished
        setTimeout(() => {
          isFormSubmitting = false;
        }, 150);
      };

      function bindGlobalEvents() {
        const menuBtn = document.getElementById('menu-btn');
        const menuDd = document.getElementById('menu-dropdown');
        if (menuBtn && menuDd) {
          menuBtn.onclick = (e) => {
            e.stopPropagation();
            menuDd.classList.toggle('hidden');
          };
          document.onclick = (e) => {
            if (!menuDd.contains(e.target) && e.target !== menuBtn) {
              menuDd.classList.add('hidden');
            }
          };
        }

        // Initialize Slide-to-Lock bar on dashboard
        initSlideToLock();

        // Leave application submit
        const leaveForm = document.getElementById('leave-form');
        if (leaveForm) {
          // Initialize table if empty, otherwise render preserved rows
          if (!activeArrangements || activeArrangements.length === 0) {
            syncArrangementsWithDates();
          } else {
            renderArrangementRowsUI();
          }

          leaveForm.onsubmit = window.submitLeaveApplication;

          // Dedicated change event listener on C-Off selector dropdown
          const coffDropdown = document.getElementById('coffSelectorDropdown');
          if (coffDropdown) {
            coffDropdown.addEventListener('change', function() {
              const selectedId = this.value;
              if (!selectedId) {
                const detailsInput = document.getElementById('cOffDetailsInput');
                if (detailsInput) detailsInput.value = '';
                return;
              }
              const records = JSON.parse(localStorage.getItem('mmantc_overtime_records') || localStorage.getItem('mmantc_overtime_logs') || '[]');
              const matched = records.find(r => String(r.id) === String(selectedId)) || appState.overtimeLogs.find(r => String(r.id) === String(selectedId));

              if (matched) {
                const detailsInput = document.getElementById('cOffDetailsInput');
                if (detailsInput) {
                  detailsInput.value = matched.description || '';
                }
              }
            });
          }

          // Clear previous timer if any
          if (autoSaveTimer) {
            clearInterval(autoSaveTimer);
            autoSaveTimer = null;
          }
          // Attach autosave only while actively on apply screen
          autoSaveTimer = setInterval(() => {
            if (appState.currentView === 'apply' && !isFormSubmitting) {
              autoSaveDraft();
            }
          }, 15000);
        }

        // Overtime form submit
        const otForm = document.getElementById('overtime-form');
        if (otForm) {
          otForm.onsubmit = (e) => {
            e.preventDefault();
            const date = document.getElementById('ot-date').value;
            const type = document.getElementById('ot-type').value;
            const holidayName = document.getElementById('ot-holidayname').value.trim();
            const hours = document.getElementById('ot-hours').value;
            const desc = document.getElementById('workDescription').value.trim();
            const earnedCoff = calculateEarnedCoff(type, hours);

            const newLog = {
              id: Date.now(),
              date,
              type,
              dutyType: type,
              holidayName,
              hours,
              description: desc,
              earnedCoff,
              status: 'Available',
              createdAt: new Date().toISOString()
            };

            appState.overtimeLogs.push(newLog);
            saveStorage();
            showToast(`Duty logged: +${earnedCoff} C-Off credited!`, 'success');
            render();
          };
        }

        // Edit Profile submit
        const epForm = document.getElementById('edit-profile-form');
        if (epForm) {
          epForm.onsubmit = (e) => {
            e.preventDefault();
            appState.profile = {
              ...appState.profile,
              name: document.getElementById('ep-name').value.trim(),
              employeeId: document.getElementById('ep-empid').value.trim(),
              department: document.getElementById('ep-dept').value,
              designation: document.getElementById('ep-desig').value,
              yearlyCL: document.getElementById('ep-cl').value,
              yearlyML: document.getElementById('ep-ml').value
            };
            saveStorage();
            closeModal();
            showToast('Profile updated!', 'success');
          };
        }

        // Change PIN submit
        const cpForm = document.getElementById('change-pin-form');
        if (cpForm) {
          cpForm.onsubmit = (e) => {
            e.preventDefault();
            const cur = document.getElementById('cp-cur').value;
            const n1 = document.getElementById('cp-new').value;
            const n2 = document.getElementById('cp-confirm').value;

            if (cur !== appState.pin) {
              alert('Current PIN is incorrect.');
              return;
            }
            if (n1.length !== 4 || isNaN(n1)) {
              alert('New PIN must be 4 digits.');
              return;
            }
            if (n1 !== n2) {
              alert('New PIN confirmation does not match.');
              return;
            }

            appState.pin = n1;
            saveStorage();
            closeModal();
            showToast('PIN successfully changed!', 'success');
          };
        }
      }

      // ==========================================
      // SLIDE TO LOCK CONTROLLER
      // ==========================================
      function initSlideToLock() {
        const track = document.getElementById('slide-lock-track');
        const knob = document.getElementById('slide-lock-knob');
        if (!track || !knob) return;

        let isDragging = false;
        let startX = 0;
        let currentX = 0;
        let maxDrag = 0;

        function updateMaxDrag() {
          const trackWidth = track.clientWidth;
          const knobWidth = knob.offsetWidth;
          // track has p-1.5 (6px padding on each side, total 12px)
          maxDrag = Math.max(0, trackWidth - knobWidth - 12);
        }

        function onStart(clientX) {
          isDragging = true;
          updateMaxDrag();
          startX = clientX - currentX;
          knob.style.transition = 'none';
        }

        function onMove(clientX) {
          if (!isDragging) return;
          const delta = clientX - startX;
          currentX = Math.max(0, Math.min(delta, maxDrag));
          knob.style.transform = `translateX(${currentX}px)`;

          // If dragged 75% or more across the track, trigger lock
          if (maxDrag > 0 && currentX >= maxDrag * 0.75) {
            isDragging = false;
            knob.style.transition = 'transform 0.15s ease-out';
            knob.style.transform = `translateX(${maxDrag}px)`;
            setTimeout(() => {
              knob.style.transform = 'translateX(0px)';
              currentX = 0;
              lockPortal();
            }, 120);
          }
        }

        function onEnd() {
          if (!isDragging) return;
          isDragging = false;
          knob.style.transition = 'transform 0.25s cubic-bezier(0.2, 0.8, 0.2, 1)';
          currentX = 0;
          knob.style.transform = 'translateX(0px)';
        }

        // Mouse events
        knob.onmousedown = (e) => {
          e.preventDefault();
          onStart(e.clientX);

          const mouseMoveHandler = (e) => onMove(e.clientX);
          const mouseUpHandler = () => {
            onEnd();
            window.removeEventListener('mousemove', mouseMoveHandler);
            window.removeEventListener('mouseup', mouseUpHandler);
          };
          window.addEventListener('mousemove', mouseMoveHandler);
          window.addEventListener('mouseup', mouseUpHandler);
        };

        // Touch events for mobile phones
        knob.ontouchstart = (e) => {
          if (e.touches && e.touches[0]) {
            onStart(e.touches[0].clientX);
          }
        };

        knob.ontouchmove = (e) => {
          if (e.touches && e.touches[0]) {
            onMove(e.touches[0].clientX);
          }
        };

        knob.ontouchend = () => {
          onEnd();
        };

        knob.ontouchcancel = () => {
          onEnd();
        };
      }

      // ==========================================
      // INITIALIZATION
      // ==========================================
      window.addEventListener('DOMContentLoaded', () => {
        loadStorage();
        render();
      });
    </script>
  </body>
</html>
