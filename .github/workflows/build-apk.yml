name: Build Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Extract Project Zip
        run: |
          unzip -o staff-leave-application-gen*.zip -d extracted_app
          shopt -s dotglob
          cp -r extracted_app/* . || true
          rm -rf extracted_app

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Build Web App
        run: |
          npm install
          npm run build || true

      - name: Initialize Capacitor Android
        run: |
          npm install @capacitor/core @capacitor/cli @capacitor/android
          if [ -d "dist" ]; then
            WEB_DIR="dist"
          elif [ -d "build" ]; then
            WEB_DIR="build"
          else
            WEB_DIR="."
          fi
          npx cap init "MMANTC Portal" "com.mmantc.leaveportal" --web-dir $WEB_DIR
          npx cap add android
          npx cap copy android

      - name: Build Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MMANTC-Leave-Portal-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
